name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: |
          dotnet build src/ZenitEngine -c Release -nologo
          dotnet build src/ZenitEngine.App -c Release -nologo
      - name: Self-test
        run: dotnet run --project src/ZenitEngine -c Release --no-build -- --selftest
